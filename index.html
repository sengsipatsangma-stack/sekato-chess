<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SEKATO CHESS</title>
  <style>
    :root {
      --bg: #12181b;
      --card-bg: #1e262c;
      --accent-green: #2ecc71;
      --accent-yellow: #f1c40f;
      --danger-red: #e74c3c;
      --text-light: #ffffff;
      --text-muted: #bdc3c7;
      --border-color: #2c3e50;
      --light-sq: #e8e2d5;
      --dark-sq: #507e60;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border: 2px solid var(--accent-green);
    }

    .header-bar {
      height: 50px;
      border-bottom: 2px solid var(--accent-green);
      display: flex;
      align-items: center;
      padding: 0 12px;
      position: relative;
      flex-shrink: 0;
    }

    .back-btn {
      background: transparent;
      border: 2px solid var(--accent-green);
      color: var(--accent-green);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .header-title {
      flex: 1;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-yellow);
      letter-spacing: 1px;
    }

    .screen {
      flex: 1;
      display: none;
      flex-direction: column;
      padding: 12px;
      overflow-y: auto;
    }

    .screen.active {
      display: flex;
    }

    #screenGame {
      padding: 8px;
      gap: 10px;
      justify-content: flex-start;
      overflow: hidden;
    }

    .title-banner {
      text-align: center;
      margin-bottom: 20px;
    }

    .title-banner h1 {
      font-size: 32px;
      color: var(--accent-yellow);
      margin-bottom: 5px;
    }

    .title-banner span {
      font-size: 26px;
      color: var(--accent-green);
    }

    .form-card {
      background: var(--card-bg);
      border: 2px solid var(--accent-green);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      background: #111;
      border: 1px solid var(--accent-green);
      color: #fff;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:disabled, select:disabled {
      opacity: 0.6;
      border-color: #555;
    }

    .save-btn, .challenge-btn, .start-btn {
      background: var(--accent-green);
      color: #111;
      font-size: 16px;
      font-weight: bold;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }

    .edit-btn {
      background: var(--accent-yellow);
      color: #111;
      font-size: 14px;
      font-weight: bold;
      padding: 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      display: none;
    }

    .decline-btn {
      background: var(--danger-red);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }
