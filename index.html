<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SEKATO CHESS</title>
  <style>
    :root {
      --bg: #12181b;
      --card-bg: #1e262c;
      --accent-green: #2ecc71;
      --accent-yellow: #f1c40f;
      --danger-red: #e74c3c;
      --text-light: #ffffff;
      --text-muted: #bdc3c7;
      --border-color: #2c3e50;
      --light-sq: #e8e2d5;
      --dark-sq: #507e60;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border: 2px solid var(--accent-green);
    }

    .header-bar {
      height: 50px;
      border-bottom: 2px solid var(--accent-green);
      display: flex;
      align-items: center;
      padding: 0 12px;
      position: relative;
      flex-shrink: 0;
    }

    .back-btn {
      background: transparent;
      border: 2px solid var(--accent-green);
      color: var(--accent-green);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .header-title {
      flex: 1;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-yellow);
      letter-spacing: 1px;
    }

    .screen {
      flex: 1;
      display: none;
      flex-direction: column;
      padding: 12px;
      overflow-y: auto;
    }

    .screen.active {
      display: flex;
    }

    /* Screen Game Layout Fixes */
    #screenGame {
      padding: 8px;
      gap: 8px;
      justify-content: flex-start;
      overflow: hidden;
    }

    /* Registration Screen */
    .title-banner {
      text-align: center;
      margin-bottom: 20px;
    }

    .title-banner h1 {
      font-size: 32px;
      color: var(--accent-yellow);
      margin-bottom: 5px;
    }

    .title-banner span {
      font-size: 26px;
      color: var(--accent-green);
    }

    .form-card {
      background: var(--card-bg);
      border: 2px solid var(--accent-green);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      background: #111;
      border: 1px solid var(--accent-green);
      color: #fff;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .save-btn, .challenge-btn, .start-btn {
      background: var(--accent-green);
      color: #111;
      font-size: 16px;
      font-weight: bold;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }

    .option-list {
      margin-top: 15px;
      font-size: 13px;
      color: var(--accent-green);
      line-height: 1.8;
    }

    /* Lobby Screen */
    .mini-board-preview {
      width: 100%;
      aspect-ratio: 1;
      max-height: 200px;
      border: 2px solid var(--accent-green);
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      margin-bottom: 10px;
      border-radius: 8px;
      overflow: hidden;
      margin: 0 auto 10px auto;
    }

    .mini-sq {
      width: 100%;
      height: 100%;
    }

    .mini-sq.light { background: var(--light-sq); }
    .mini-sq.dark { background: var(--dark-sq); }

    .online-section {
      border: 2px solid var(--accent-green);
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      flex: 1;
    }

    .online-section h3 {
      color: var(--accent-green);
      margin-bottom: 8px;
      font-size: 15px;
    }

    .player-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .player-item {
      padding: 8px 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .player-num {
      color: var(--accent-yellow);
      font-weight: bold;
      margin-right: 6px;
    }

    .badge-gm {
      background: var(--accent-yellow);
      color: #111;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 5px;
      border-radius: 4px;
      margin-left: 6px;
    }

    /* Challenge Modal */
    .challenge-card {
      background: var(--card-bg);
      border: 2px solid var(--accent-green);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin: auto 0;
    }

    .challenge-card h2 {
      color: var(--accent-green);
      font-size: 24px;
      margin-bottom: 8px;
    }

    /* Chess Board Screen Adjustments */
    .chess-board {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      border: 2px solid var(--accent-green);
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sq {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(22px, 7.5vw, 38px);
      cursor: pointer;
      position: relative;
    }

    .sq.light { background: var(--light-sq); }
    .sq.dark { background: var(--dark-sq); }

    .sq.selected {
      box-shadow: inset 0 0 0 4px var(--accent-yellow);
    }

    .sq.target::after {
      content: '';
      width: 12px;
      height: 12px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 50%;
      position: absolute;
    }

    .piece.white { color: #ffffff; text-shadow: 0 1px 2px #000; }
    .piece.black { color: #111111; text-shadow: 0 1px 1px #fff; }

    .game-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px;
      flex-shrink: 0;
    }

    .round-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--accent-green);
      background: var(--card-bg);
      color: var(--accent-green);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .giveup-btn {
      border-color: var(--danger-red);
      color: var(--danger-red);
    }

    .chat-box {
      border: 2px solid var(--accent-green);
      border-radius: 8px;
      padding: 8px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
      overflow: hidden;
    }

    .messages {
      font-size: 13px;
      color: var(--text-light);
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 6px;
    }

    .chat-input-row {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .chat-input-row input {
      padding: 8px;
      font-size: 13px;
    }

    /* Result Screens */
    .result-card {
      margin: auto;
      width: 85%;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      border: 3px solid;
    }

    .result-card.win {
      border-color: var(--accent-green);
      background: #13271b;
    }

    .result-card.win h2 {
      color: var(--accent-green);
      font-size: 28px;
    }

    .result-card.lose {
      border-color: var(--danger-red);
      background: #2a1515;
    }

    .result-card.lose h2 {
      color: var(--danger-red);
      font-size: 28px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="header-bar">
      <button class="back-btn" id="headerBackBtn" onclick="goBack()">⟲</button>
      <div class="header-title" id="headerTitle">SEKATO CHESS</div>
    </div>

    <!-- Screen 1: Registration -->
    <div class="screen active" id="screenProfile">
      <div class="title-banner">
        👑
        <h1>SEKATO</h1>
        <span>CHESS</span>
      </div>

      <div class="form-card">
        <input type="text" id="profName" placeholder="Name" maxlength="16">
        <div class="input-group">
          <input type="text" id="profCountry" placeholder="Country">
          <input type="number" id="profAge" placeholder="Age" style="width: 80px;">
        </div>
        <select id="profSkill">
          <option value="first">1) First time (+30 IQ)</option>
          <option value="medium">2) Medium (+25 IQ)</option>
          <option value="expert">3) Expert (+20 IQ)</option>
        </select>
        <button class="save-btn" onclick="saveProfile()">SAVE</button>
      </div>

      <div class="option-list">
        OPTION:<br>
        1) First time ➔ 30 IQ<br>
        2) Medium ➔ 25 IQ<br>
        3) Expert ➔ 20 IQ
      </div>
    </div>

    <!-- Screen 2: Lobby -->
    <div class="screen" id="screenLobby">
      <div class="mini-board-preview" id="miniBoard"></div>

      <button class="start-btn" onclick="startMatching()">CHALLENGE START</button>

      <div class="online-section">
        <h3>ONLINE PLAYERS LIST</h3>
        <div class="player-list" id="onlineList">
          <!-- Numbered Player List (1, 2, 3...) -->
        </div>
      </div>
    </div>

    <!-- Screen 3: Challenge Modal -->
    <div class="screen" id="screenChallenge">
      <div class="challenge-card">
        <h2 id="oppNameDisplay">hadibautdi</h2>
        <p style="margin-bottom:15px; color:var(--text-muted);">IQ: <span id="oppIqDisplay">999</span></p>
        <button class="challenge-btn" onclick="launchGame()">CHALLENGE</button>
      </div>
    </div>

    <!-- Screen 4: Chess Board Screen -->
    <div class="screen" id="screenGame">
      <div class="chess-board" id="mainBoard"></div>

      <div class="game-controls">
        <button class="round-btn" title="Undo Move" onclick="undoMove()">↶</button>
        <span id="turnStatus" style="font-weight: bold; color: var(--accent-yellow); font-size:15px;">White turn</span>
        <button class="round-btn giveup-btn" title="Resign / Give Up" onclick="resignGame()">🏳</button>
      </div>

      <div class="chat-box">
        <div class="messages" id="chatMessages">
          <div><i>Unlimited Chat & Emojis active 😊♟️🔥</i></div>
        </div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Write unlimited text & emojis 😊...">
          <button class="save-btn" style="padding: 6px 12px; margin-top:0;" onclick="sendText()">Send</button>
        </div>
      </div>
    </div>

    <!-- Screen 5: WIN Screen -->
    <div class="screen" id="screenWin">
      <div class="result-card win">
        <h2>YOU WIN</h2>
        <p style="margin-top:8px;">IQ +50</p>
        <button class="save-btn" style="margin-top: 16px;" onclick="switchScreen('screenLobby')">CONTINUE</button>
      </div>
    </div>

    <!-- Screen 6: LOSE Screen -->
    <div class="screen" id="screenLose">
      <div class="result-card lose">
        <h2>YOU LOSE</h2>
        <p style="margin-top:8px;">IQ -5</p>
        <button class="save-btn" style="margin-top: 16px; background: var(--danger-red); color:#fff;" onclick="switchScreen('screenLobby')">CONTINUE</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getDatabase, ref, set, onValue, onDisconnect, remove } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

    // Firebase database configuration
    const firebaseConfig = {
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com"
    };

    let db = null;
    let myUserRef = null;

    try {
      if (!firebaseConfig.databaseURL.includes("YOUR_PROJECT")) {
        const app = initializeApp(firebaseConfig);
        db = getDatabase(app);
      }
    } catch(e) { console.log("Offline mode active"); }

    // State Variables
    window.player = { name: '', country: '', age: '', iq: 20, id: 'user_' + Math.random().toString(36).substring(2, 7) };
    window.game = new Chess();
    window.selectedSquare = null;
    window.currentOpponent = { name: 'hadibautdi', iq: 999, isAi: true };
    window.liveOnlinePlayers = [];

    const symbols = {
      p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚',
      P: '♙', R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔'
    };

    window.switchScreen = function(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    };

    window.goBack = function() {
      if (myUserRef && db) {
        remove(myUserRef);
      }
      switchScreen('screenProfile');
    };

    window.saveProfile = function() {
      const nameInput = document.getElementById('profName').value.trim();
      if (!nameInput) {
        alert("Please enter your name!");
        return;
      }

      const skill = document.getElementById('profSkill').value;
      let startIq = 20;
      if (skill === 'first') startIq = 30;
      if (skill === 'medium') startIq = 25;
      if (skill === 'expert') startIq = 20;

      window.player.name = nameInput;
      window.player.iq = startIq;

      if (db) {
        myUserRef = ref(db, 'online_players/' + window.player.id);
        set(myUserRef, {
          name: window.player.name,
          iq: window.player.iq
        });
        onDisconnect(myUserRef).remove();
      }

      renderLobby();
      listenToOnlinePlayers();
      switchScreen('screenLobby');
    };

    function listenToOnlinePlayers() {
      if (!db) return;
      const playersRef = ref(db, 'online_players');
      onValue(playersRef, (snapshot) => {
        const data = snapshot.val() || {};
        window.liveOnlinePlayers = [];
        for (let id in data) {
          if (id !== window.player.id) {
            window.liveOnlinePlayers.push({ id, ...data[id] });
          }
        }
        renderLobby();
      });
    }

    window.renderLobby = function() {
      const mini = document.getElementById('miniBoard');
      mini.innerHTML = '';
      for (let i = 0; i < 64; i++) {
        const sq = document.createElement('div');
        const r = Math.floor(i / 8), c = i % 8;
        sq.className = 'mini-sq ' + ((r + c) % 2 ? 'dark' : 'light');
        mini.appendChild(sq);
      }

      const list = document.getElementById('onlineList');
      list.innerHTML = '';
      let count = 1;

      // 1. Pro GM Hadibautdi
      const aiItem = document.createElement('div');
      aiItem.className = 'player-item';
      aiItem.innerHTML = `<div><span class="player-num">${count++}.</span><b>hadibautdi</b> <span class="badge-gm">PRO GM</span></div> <span style="color:var(--accent-yellow)">IQ 999</span>`;
      aiItem.onclick = () => openChallenge('hadibautdi', 999, true);
      list.appendChild(aiItem);

      // 2. Real Friends Online
      window.liveOnlinePlayers.forEach(p => {
        const item = document.createElement('div');
        item.className = 'player-item';
        item.innerHTML = `<div><span class="player-num">${count++}.</span><b>${p.name}</b> <span style="color:var(--accent-green); font-size:12px;">● Online</span></div> <span style="color:var(--accent-green)">IQ ${p.iq}</span>`;
        item.onclick = () => openChallenge(p.name, p.iq, false);
        list.appendChild(item);
      });
    };

    function openChallenge(name, iq, isAi) {
      window.currentOpponent = { name, iq, isAi };
      document.getElementById('oppNameDisplay').innerText = name;
      document.getElementById('oppIqDisplay').innerText = iq;
      switchScreen('screenChallenge');
    }

    window.startMatching = function() {
      openChallenge('hadibautdi', 999, true);
    };

    window.launchGame = function() {
      window.game.reset();
      window.selectedSquare = null;
      renderBoard();
      switchScreen('screenGame');
      addChatMessage(`System: Match started against ${window.currentOpponent.name}! 🔥`);
    };

    function renderBoard() {
      const boardEl = document.getElementById('mainBoard');
      boardEl.innerHTML = '';
      const boardState = window.game.board();
      const files = 'abcdefgh';

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sqName = files[c] + (8 - r);
          const piece = boardState[r][c];

          const sq = document.createElement('div');
          sq.className = 'sq ' + ((r + c) % 2 ? 'dark' : 'light');

          if (window.selectedSquare === sqName) sq.classList.add('selected');

          if (window.selectedSquare) {
            const moves = window.game.moves({ square: window.selectedSquare, verbose: true });
            if (moves.some(m => m.to === sqName)) sq.classList.add('target');
          }

          if (piece) {
            const pieceSpan = document.createElement('span');
            pieceSpan.className = 'piece ' + (piece.color === 'w' ? 'white' : 'black');
            const pieceKey = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
            pieceSpan.textContent = symbols[pieceKey];
            sq.appendChild(pieceSpan);
          }

          sq.onclick = () => handleSquareClick(sqName);
          boardEl.appendChild(sq);
        }
      }

      document.getElementById('turnStatus').innerText = window.game.turn() === 'w' ? 'White turn' : 'Black turn';

      if (window.game.in_checkmate()) {
        if (window.game.turn() === 'b') {
          window.player.iq += 50;
          switchScreen('screenWin');
        } else {
          window.player.iq = Math.max(0, window.player.iq - 5);
          switchScreen('screenLose');
        }
      }
    }

    function handleSquareClick(sqName) {
      if (window.selectedSquare) {
        const move = window.game.move({ from: window.selectedSquare, to: sqName, promotion: 'q' });
        if (move) {
          window.selectedSquare = null;
          renderBoard();

          if (window.currentOpponent.isAi && !window.game.game_over()) {
            setTimeout(makeProAiMove, 500);
          }
          return;
        }
      }

      const piece = window.game.get(sqName);
      if (piece && piece.color === window.game.turn()) {
        window.selectedSquare = sqName;
      } else {
        window.selectedSquare = null;
      }
      renderBoard();
    }

    function makeProAiMove() {
      const possibleMoves = window.game.moves();
      if (possibleMoves.length === 0) return;

      let selectedMove = possibleMoves.find(m => m.includes('x')) || possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
      window.game.move(selectedMove);
      renderBoard();
    }

    window.undoMove = function() {
      window.game.undo();
      if (window.currentOpponent.isAi) window.game.undo();
      window.selectedSquare = null;
      renderBoard();
    };

    window.resignGame = function() {
      if (confirm("Are you sure you want to give up? You will lose 5 IQ.")) {
        window.player.iq = Math.max(0, window.player.iq - 5);
        switchScreen('screenLose');
      }
    };

    window.sendText = function() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (text) {
        addChatMessage(`${window.player.name}: ${text}`);
        input.value = '';
      }
    };

    function addChatMessage(msg) {
      const box = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.textContent = msg;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
