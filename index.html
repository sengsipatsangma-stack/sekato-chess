<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEKATO CHESS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0d1117; color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center;
    }
    h1 { margin: 8px 0; color: #58a6ff; font-size: 24px; text-shadow: 0 0 10px rgba(88,166,255,0.3); }
    #board { width: 92vw; max-width: 400px; margin: 8px auto; border: 3px solid #30363d; border-radius: 8px; }
    
    .card {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      padding: 10px; width: 92vw; max-width: 400px; margin-bottom: 8px;
    }
    .flex-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    input, select, button {
      background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
      padding: 6px 10px; border-radius: 6px; font-size: 13px; font-weight: bold;
    }
    button { cursor: pointer; }
    button:hover { background: #30363d; color: #58a6ff; }
    
    #status { font-size: 13px; color: #8b949e; text-align: center; margin: 4px 0; }
    #chatBox { height: 70px; overflow-y: auto; background: #0d1117; border: 1px solid #30363d; padding: 6px; font-size: 12px; margin-bottom: 4px; border-radius: 4px; }

    /* Pawn Promotion Popup Modal */
    .modal {
      display: none; position: fixed; z-index: 1000; left: 0; top: 0;
      width: 100%; height: 100%; background: rgba(0,0,0,0.85);
      justify-content: center; align-items: center;
    }
    .modal-content {
      background: #161b22; padding: 20px; border-radius: 12px;
      text-align: center; border: 1px solid #30363d; box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    .piece-btn {
      font-size: 28px; margin: 5px; padding: 10px 16px; background: #21262d;
      border: 1px solid #30363d; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>SEKATO CHESS</h1>

  <!-- Player Profile Card -->
  <div class="card">
    <div class="flex-row">
      <span>Player:</span>
      <input type="text" id="usernameInput" placeholder="Your Name">
      <button id="lockNameBtn" onclick="toggleNameLock()">🔒 Lock</button>
      <button id="musicBtn" onclick="toggleMusic()">🎵 Music: ON</button>
    </div>
  </div>

  <!-- Game Mode Selector -->
  <div class="card">
    <div class="flex-row">
      <select id="gameMode" onchange="switchMode()">
        <option value="local">📱 Local 2-Player (1 Phone)</option>
        <option value="ai_easy">🤖 Play vs Ong (Easy AI)</option>
        <option value="ai_hard">🧠 Play vs Hadibautdi (Hard GM)</option>
        <option value="online">🌐 Online Multiplayer</option>
      </select>
      <select id="timeControl">
        <option value="7">7 Mins</option>
        <option value="10">10 Mins</option>
        <option value="20">20 Mins</option>
      </select>
      <button onclick="resetGame()">🔄 New Game</button>
    </div>
  </div>

  <div id="status">Status: White to move</div>
  <div id="board"></div>

  <!-- Online Controls & Chat -->
  <div class="card" id="onlineSection" style="display: none;">
    <div class="flex-row" style="margin-bottom: 6px;">
      <input type="text" id="roomIdInput" placeholder="Room Code (e.g. 123)" style="flex:1;">
      <button onclick="joinOnlineRoom('w')">Create (White)</button>
      <button onclick="joinOnlineRoom('b')">Join (Black)</button>
    </div>
    <div id="chatBox"></div>
    <div class="flex-row">
      <input type="text" id="chatInput" placeholder="Type message..." style="flex:1;">
      <button onclick="sendChat()">Send</button>
      <button onclick="sendEmoji('😊')">😊</button>
      <button onclick="sendEmoji('👍')">👍</button>
    </div>
  </div>

  <!-- Pawn Promotion Modal -->
  <div id="promoModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0; color:#58a6ff;">Promote Pawn To</h3>
      <button class="piece-btn" onclick="selectPromotion('q')">♛ Queen</button>
      <button class="piece-btn" onclick="selectPromotion('r')">♜ Rook</button>
      <button class="piece-btn" onclick="selectPromotion('b')">♝ Bishop</button>
      <button class="piece-btn" onclick="selectPromotion('n')">♞ Knight</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    // Firebase Setup
    const firebaseConfig = {
      databaseURL: "https://sekato-chess-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    var board = null;
    var game = new Chess();
    var pendingMove = null;
    var nameLocked = false;
    var myColor = 'w';
    var roomId = null;
    var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var musicPlaying = true;
    var bgTimer = null;

    // Profile Load
    var savedName = localStorage.getItem("sekato_username") || "Player_" + Math.floor(Math.random()*1000);
    document.getElementById("usernameInput").value = savedName;

    function toggleNameLock() {
      nameLocked = !nameLocked;
      document.getElementById("usernameInput").disabled = nameLocked;
      document.getElementById("lockNameBtn").innerText = nameLocked ? "✏️ Edit" : "🔒 Lock";
      if(nameLocked) localStorage.setItem("sekato_username", document.getElementById("usernameInput").value);
    }

    // Audio synthesizer
    function playSound(freq, duration) {
      try {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.frequency.value = freq; osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function scheduleMusic() {
      if (!musicPlaying) return;
      playSound(200, 0.3);
      bgTimer = setTimeout(scheduleMusic, 4000);
    }
    scheduleMusic();

    function toggleMusic() {
      musicPlaying = !musicPlaying;
      document.getElementById("musicBtn").innerText = musicPlaying ? "🎵 Music: ON" : "🔇 Music: OFF";
      if (musicPlaying) scheduleMusic(); else clearTimeout(bgTimer);
    }

    // Board Movement Rules
    function onDragStart(source, piece, position, orientation) {
      if (game.game_over()) return false;
      var mode = document.getElementById("gameMode").value;
      if (mode.startsWith("ai_") && game.turn() === 'b') return false;
      if (mode === "online" && game.turn() !== myColor) return false;
    }

    function onDrop(source, target) {
      var sourceRank = source[1];
      var targetRank = target[1];
      var piece = game.get(source);

      // Trigger Pawn Promotion Popup when reaching back rank
      if (piece && piece.type === 'p' && ((piece.color === 'w' && targetRank === '8') || (piece.color === 'b' && targetRank === '1'))) {
        pendingMove = { source: source, target: target };
        document.getElementById("promoModal").style.display = "flex";
        return;
      }

      var move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';

      playSound(move.captured ? 440 : 330, 0.15);
      updateStatus();
      syncOnlineMove();
      checkAIMove();
    }

    function selectPromotion(piece) {
      document.getElementById("promoModal").style.display = "none";
      if (pendingMove) {
        var move = game.move({ from: pendingMove.source, to: pendingMove.target, promotion: piece });
        board.position(game.fen());
        playSound(520, 0.2);
        updateStatus();
        syncOnlineMove();
        pendingMove = null;
        checkAIMove();
      }
    }

    function checkAIMove() {
      var mode = document.getElementById("gameMode").value;
      if (!game.game_over() && mode.startsWith("ai_") && game.turn() === 'b') {
        var delay = (mode === "ai_hard") ? 1200 : 500;
        setTimeout(makeAIMove, delay);
      }
    }

    function makeAIMove() {
      var moves = game.moves();
      if (moves.length === 0) return;
      var move = moves[Math.floor(Math.random() * moves.length)];
      game.move(move);
      board.position(game.fen());
      playSound(300, 0.15);
      updateStatus();
    }

    function syncOnlineMove() {
      var mode = document.getElementById("gameMode").value;
      if (mode === "online" && roomId) {
        db.ref('rooms/' + roomId).update({ fen: game.fen(), turn: game.turn() });
      }
    }

    function joinOnlineRoom(color) {
      roomId = document.getElementById("roomIdInput").value.trim();
      if (!roomId) return alert("Enter a Room Code first!");
      myColor = color;
      board.orientation(color === 'w' ? 'white' : 'black');
      
      db.ref('rooms/' + roomId).on('value', (snap) => {
        const data = snap.val();
        if (data && data.fen && data.fen !== game.fen()) {
          game.load(data.fen);
          board.position(data.fen);
          playSound(350, 0.15);
          updateStatus();
        }
      });
      
      // Listen for Chat
      db.ref('chats/' + roomId).on('child_added', (snap) => {
        const msg = snap.val();
        const chatBox = document.getElementById("chatBox");
        chatBox.innerHTML += `<div><b>${msg.user}:</b> ${msg.text}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      });

      alert(`Joined Room ${roomId} as ${color === 'w' ? 'White' : 'Black'}`);
    }

    function sendChat() {
      var input = document.getElementById("chatInput");
      var text = input.value.trim();
      if (!text || !roomId) return;
      var user = document.getElementById("usernameInput").value || "Player";
      db.ref('chats/' + roomId).push({ user: user, text: text });
      input.value = "";
    }

    function sendEmoji(emoji) {
      if (!roomId) return;
      var user = document.getElementById("usernameInput").value || "Player";
      db.ref('chats/' + roomId).push({ user: user, text: emoji });
    }

    function updateStatus() {
      var status = '';
      var moveColor = game.turn() === 'w' ? 'White' : 'Black';
      if (game.in_checkmate()) status = 'Game over, ' + moveColor + ' is in checkmate.';
      else if (game.in_draw()) status = 'Game over, drawn position.';
      else {
        status = moveColor + ' to move';
        if (game.in_check()) status += ', ' + moveColor + ' is in check!';
      }
      document.getElementById("status").innerText = status;
    }

    function switchMode() {
      var mode = document.getElementById("gameMode").value;
      document.getElementById("onlineSection").style.display = (mode === "online") ? "block" : "none";
      if (mode !== "online") board.orientation('white');
      resetGame();
    }

    function resetGame() {
      game.reset();
      board.position('start');
      updateStatus();
    }

    var config = {
      draggable: true,
      position: 'start',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: function() { board.position(game.fen()); }
    };

    board = Chessboard('board', config);
    updateStatus();
  </script>
</body>
</html>
